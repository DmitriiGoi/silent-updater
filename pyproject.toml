[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silent-updater"
version = "0.1.0"
description = "LLM-driven autonomous agent for updating vulnerable Java/Maven dependencies"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "silent-updater contributors" }]
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "lxml>=5.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "keyring>=24",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-httpx>=0.30",
]

[project.scripts]
silent-updater = "silent_updater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/silent_updater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
